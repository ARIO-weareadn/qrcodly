# Override SOLO para pruebas en localhost. Uso:
#   docker compose -f docker-compose.prod.yaml -f docker-compose.local.yaml up -d ...
# Lee las variables de .env (no de .env.production) y reescribe las URLs de localhost.
# MinIO ya apunta a pgsty/silo y pgsty/mc en docker-compose.prod.yaml.
services:
  migrate:
    env_file: !override
      - .env
  backend:
    env_file: !override
      - .env
    environment:
      BASE_URL: http://localhost:5001
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5001
      S3_PUBLIC_URL: http://localhost:9000/qrcodly
  frontend:
    env_file: !override
      - .env
