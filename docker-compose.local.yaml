# Override SOLO para pruebas en localhost. Uso:
#   docker compose -f docker-compose.prod.yaml -f docker-compose.local.yaml up -d ...
# Lee las variables de .env (no de .env.production) y sustituye MinIO por pgsty/silo,
# porque minio/minio y minio/mc ya no se descargan de Docker Hub.
services:
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
  minio-setup:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
  migrate:
    env_file: !override
      - .env
  backend:
    env_file: !override
      - .env
    environment:
      BASE_URL: http://localhost:5001
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5001
      S3_PUBLIC_URL: http://localhost:9000/qrcodly
  frontend:
    env_file: !override
      - .env
